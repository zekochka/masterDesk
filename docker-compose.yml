services:
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: masterdesk
      POSTGRES_USER: masterdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - masterdesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masterdesk -d masterdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  masterdesk_pgdata:
